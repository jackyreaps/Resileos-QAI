name: Fix executable bit
on:
  push:
    paths: ['.github/workflows/fix-exec-bit.yml']
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          chmod +x scripts/ops/verify_container.sh scripts/ops/verify_tunnel.sh
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/ops/
          git diff --cached --quiet || git commit -m "chore(ops): set executable bit"
          git push

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Resileos Studio</title>
    <style>
        :root {
            --bg: #fcfcfc; --panel: #ffffff; --text: #1a1a1a; --muted: #666;
            --accent: #1a4d8f; --accent-hover: #143c70; --border: #e5e5e5;
            --user-bg: #1a4d8f; --user-text: #fff; --bot-bg: #ffffff;
            --danger: #d93838; --success: #0d9463;
        }
        [data-theme="dark"] {
            --bg: #121212; --panel: #1e1e1e; --text: #ededed; --muted: #a0a0a0;
            --accent: #3b82f6; --accent-hover: #2563eb; --border: #333;
            --user-bg: #2563eb; --user-text: #fff; --bot-bg: #1e1e1e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        .header { padding: 12px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: var(--panel); }
        .header-title { font-size: 1rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; }
        .dot.online { background: var(--success); }
        .dot.offline { background: var(--danger); }
        .header-actions { display: flex; gap: 8px; }
        .btn-icon { background: none; border: none; color: var(--muted); cursor: pointer; padding: 6px; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
        .btn-icon:hover { background: var(--bg); color: var(--text); }
        #chat { flex: 1; overflow-y: auto; padding: 24px 16px; display: flex; flex-direction: column; gap: 24px; }
        .msg-row { display: flex; gap: 16px; max-width: 768px; margin: 0 auto; width: 100%; }
        .msg-row.user { justify-content: flex-end; }
        .avatar { width: 28px; height: 28px; border-radius: 4px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .avatar.bot { background: var(--accent); color: #fff; }
        .avatar.user { background: #e5e5e0; color: #333; }
        [data-theme="dark"] .avatar.user { background: #333; color: #fff; }
        .bubble { padding: 12px 16px; border-radius: 12px; font-size: 0.95rem; line-height: 1.5; max-width: 85%; }
        .bubble.user { background: var(--user-bg); color: var(--user-text); border-bottom-right-radius: 2px; }
        .bubble.bot { background: var(--bot-bg); border: 1px solid var(--border); border-bottom-left-radius: 2px; }
        .bubble strong { font-weight: 600; color: var(--accent); }
        .meta { font-size: 0.75rem; color: var(--muted); margin-top: 8px; font-family: ui-monospace, monospace; }
        .panel { background: var(--panel); border-bottom: 1px solid var(--border); padding: 12px 20px; font-size: 0.85rem; display: none; flex-wrap: wrap; gap: 8px; }
        .panel.open { display: flex; }
        .tool-chip { background: var(--bg); border: 1px solid var(--border); padding: 6px 12px; border-radius: 6px; cursor: pointer; color: var(--text); font-size: 0.8rem; }
        .tool-chip:hover { border-color: var(--accent); }
        .tool-chip.legion { border-color: var(--accent); background: rgba(26, 77, 143, 0.05); }
        [data-theme="dark"] .tool-chip.legion { background: rgba(59, 130, 246, 0.1); }
        .group-row { width: 100%; margin-bottom: 4px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
        .group-label { font-weight: 600; color: var(--muted); width: 60px; }
        .input-wrap { padding: 16px; background: var(--bg); display: flex; justify-content: center; }
        .input-box { width: 100%; max-width: 768px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; display: flex; align-items: flex-end; padding: 6px; }
        .input-box:focus-within { border-color: var(--accent); }
        input[type="text"] { flex: 1; border: none; background: transparent; padding: 10px; font-size: 1rem; color: var(--text); outline: none; }
        button.send { background: var(--accent); color: white; border: none; border-radius: 8px; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; cursor: pointer; margin: 4px; }
        button.send:disabled { background: #999; }
        .suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; max-width: 600px; margin-left: auto; margin-right: auto; }
        .suggestion { background: var(--panel); border: 1px solid var(--border); padding: 10px 16px; border-radius: 8px; font-size: 0.9rem; cursor: pointer; color: var(--text); }
        .suggestion:hover { border-color: var(--accent); color: var(--accent); }
        .typing { display: flex; gap: 4px; align-items: center; height: 20px; }
        .typing span { width: 5px; height: 5px; background: var(--muted); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
        .typing span:nth-child(1) { animation-delay: -0.32s; }
        .typing span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        pre { background: var(--bg); padding: 12px; border-radius: 8px; overflow-x: auto; font-size: 0.8rem; margin-top: 8px; border: 1px solid var(--border); }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-title">
            <div class="dot" id="status"></div>
            Resileos Studio
        </div>
        <div class="header-actions">
            <button class="btn-icon" onclick="toggleTools()" title="Tools">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>
            </button>
            <button class="btn-icon" onclick="toggleKin()" title="Kin">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
            </button>
            <button class="btn-icon" onclick="toggleTheme()" title="Theme">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            </button>
        </div>
    </div>

    <div id="tools-panel" class="panel"></div>
    <div id="kin-panel" class="panel">
        <div class="group-row">
            <span class="group-label">Kin:</span>
            <span class="tool-chip" onclick="runKinCycle()">Iris → Metis → Hermes</span>
            <span class="tool-chip" onclick="listCheckpoints()">Hades Checkpoints</span>
            <span class="tool-chip" onclick="runResidualCheck()">Residual Check</span>
        </div>
    </div>

    <div id="chat">
        <div class="msg-row bot">
            <div class="avatar bot">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>
            </div>
            <div class="bubble bot">Exact residual memory engine. Facts as residual packets. Unknowns abstained. Kin + harness available.</div>
        </div>
        <div class="suggestions">
            <div class="suggestion" onclick="quickAsk('remember alice works_at acme')">Teach fact</div>
            <div class="suggestion" onclick="quickAsk('alice works_at')">Query fact</div>
            <div class="suggestion" onclick="quickAsk('Who won the Super Bowl in 2024?')">Test web search</div>
            <div class="suggestion" onclick="runKinCycle()">Run Kin cycle</div>
            <div class="suggestion" onclick="quickAsk('/tool residual_consistency')">Residual check</div>
        </div>
    </div>

    <div class="input-wrap">
        <div class="input-box">
            <input type="file" id="file-input" style="display:none" onchange="handleFileUpload()">
            <button class="btn-icon" onclick="document.getElementById('file-input').click()" title="Upload file">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
            </button>
            <input type="text" id="input" placeholder="Ask anything or attach a file..." onkeypress="handleEnter(event)">
            <button class="send" id="send" onclick="sendMsg()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
            </button>
        </div>
    </div>

    <script>
        const API_KEY = "No4dymPJ4tfRn0BZFuNL07kTnMyCeu5xHw2mpsWmjwk";
        const API_URL = "https://api.resileosai.fun/api/v1";
        const chat = document.getElementById('chat');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('send');
        const statusDot = document.getElementById('status');
        const toolsPanel = document.getElementById('tools-panel');
        const kinPanel = document.getElementById('kin-panel');
        let chatHistory = [];
        let selectedFile = null;

        if (window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.setAttribute('data-theme', 'dark');

        function toggleTheme() {
            const t = document.documentElement.getAttribute('data-theme');
            document.documentElement.setAttribute('data-theme', t === 'dark' ? 'light' : 'dark');
        }

        fetch(`${API_URL}/ready`).then(r => {
            statusDot.classList.add(r.ok ? 'online' : 'offline');
        }).catch(() => statusDot.classList.add('offline'));

        async function loadTools() {
            try {
                const r = await fetch(`${API_URL}/tools`, { headers: { 'X-API-Key': API_KEY } });
                const d = await r.json();
                const tools = d.tools || d || [];
                const groups = { Iris: [], Metis: [], Hermes: [], Hades: [], Apollo: [], Other: [] };
                tools.forEach(t => {
                    const name = typeof t === 'string' ? t : t.name;
                    const kin = (typeof t === 'object' && t.kin) || inferKin(name);
                    const isLegion = typeof t === 'object' && t.legion;
                    (groups[kin] || groups.Other).push({ name, legion: isLegion });
                });
                toolsPanel.innerHTML = Object.entries(groups)
                    .filter(([_, arr]) => arr.length)
                    .map(([kin, arr]) => `
                        <div class="group-row">
                            <span class="group-label">${kin}:</span>
                            ${arr.map(t => `<span class="tool-chip ${t.legion ? 'legion' : ''}" onclick="runTool('${t.name}')">${t.name}</span>`).join('')}
                        </div>
                    `).join('');
            } catch (e) {
                toolsPanel.innerHTML = 'Could not load tools.';
            }
        }

        function inferKin(name) {
            if (/observe|flag|iris/i.test(name)) return 'Iris';
            if (/policy|risk|guide|metis/i.test(name)) return 'Metis';
            if (/cycle|navigate|review|hermes|separated/i.test(name)) return 'Hermes';
            if (/hades|checkpoint|save|restore/i.test(name)) return 'Hades';
            if (/apollo|verify|residual|success/i.test(name)) return 'Apollo';
            return 'Other';
        }

        function toggleTools() {
            toolsPanel.classList.toggle('open');
            kinPanel.classList.remove('open');
            if (toolsPanel.classList.contains('open') && !toolsPanel.innerHTML) loadTools();
        }

        function toggleKin() {
            kinPanel.classList.toggle('open');
            toolsPanel.classList.remove('open');
        }

        function quickAsk(text) { input.value = text; sendMsg(); }
        function handleEnter(e) { if (e.key === 'Enter') sendMsg(); }

        function handleFileUpload() {
            const fileInput = document.getElementById('file-input');
            if (fileInput.files.length > 0) {
                selectedFile = fileInput.files[0];
                addMsg(`[Attached: ${selectedFile.name}]`, 'user');
            }
        }

        function addMsg(text, sender) {
            const row = document.createElement('div');
            row.className = `msg-row ${sender}`;
            const avatar = document.createElement('div');
            avatar.className = `avatar ${sender}`;
            if (sender === 'user') {
                avatar.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>`;
            } else {
                avatar.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>`;
            }
            const bubble = document.createElement('div');
            bubble.className = `bubble ${sender}`;
            bubble.innerHTML = text;
            if (sender === 'user') { row.appendChild(bubble); row.appendChild(avatar); }
            else { row.appendChild(avatar); row.appendChild(bubble); }
            chat.appendChild(row);
            chat.scrollTop = chat.scrollHeight;
            return bubble;
        }

        async function runKinCycle() {
            addMsg("Running Kin cycle...", 'user');
            const bubble = addMsg('<div class="typing"><span></span><span></span><span></span></div>', 'bot');
            try {
                const r = await fetch(`${API_URL}/kin/cycle`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-API-Key': API_KEY },
                    body: JSON.stringify({ apply_policy: true })
                });
                const d = await r.json();
                bubble.innerHTML = r.ok ? `Kin cycle complete. Lesson: ${d.lesson || '—'}` : `Error: ${JSON.stringify(d.detail) || 'failed'}`;
            } catch (e) { bubble.innerHTML = `Kin cycle error: ${e.message}`; }
        }

        async function listCheckpoints() {
            addMsg("Listing Hades checkpoints...", 'user');
            const bubble = addMsg('<div class="typing"><span></span><span></span><span></span></div>', 'bot');
            try {
                const r = await fetch(`${API_URL}/kin/hades/list`, { headers: { 'X-API-Key': API_KEY } });
                const d = await r.json();
                const cps = d.checkpoints || d || [];
                bubble.innerHTML = cps.length
                    ? cps.map(cp => `<div style="margin:6px 0"><code>${cp.id || cp.name}</code> <button class="tool-chip" style="margin-left:8px" onclick="restoreCheckpoint('${cp.id || cp.name}')">Restore</button></div>`).join('')
                    : "No checkpoints.";
            } catch (e) { bubble.innerHTML = "No checkpoints endpoint."; }
        }

        async function restoreCheckpoint(id) {
            addMsg(`Restoring checkpoint ${id}...`, 'user');
            const bubble = addMsg('<div class="typing"><span></span><span></span><span></span></div>', 'bot');
            try {
                const r = await fetch(`${API_URL}/kin/hades/restore`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-API-Key': API_KEY },
                    body: JSON.stringify({ checkpoint_id: id, fresh: true })
                });
                bubble.innerHTML = r.ok ? "Restored." : "Restore failed.";
            } catch (e) { bubble.innerHTML = "Restore failed."; }
        }

        async function runResidualCheck() { return runTool("residual_consistency"); }

        async function runTool(name) {
            addMsg(`Calling tool ${name}...`, 'user');
            const bubble = addMsg('<div class="typing"><span></span><span></span><span></span></div>', 'bot');
            try {
                const r = await fetch(`${API_URL}/tools/${name}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-API-Key': API_KEY },
                    body: JSON.stringify({})
                });
                const d = await r.json();
                bubble.innerHTML = `<pre>${JSON.stringify(d, null, 2)}</pre>`;
            } catch (e) { bubble.innerHTML = `Tool ${name} failed.`; }
        }

        async function sendMsg() {
            const text = input.value.trim();
            if (!text && !selectedFile) return;
            addMsg(text || `[File: ${selectedFile.name}]`, 'user');
            input.value = '';
            sendBtn.disabled = true;

            const bubble = addMsg('<div class="typing"><span></span><span></span><span></span></div>', 'bot');

            try {
                const endpoint = selectedFile ? '/upload' : '/chat';
                const fetchOptions = selectedFile 
                    ? { 
                        method: 'POST', 
                        headers: { 'X-API-Key': API_KEY }, 
                        body: (() => { const fd = new FormData(); fd.append("message", text); fd.append("file", selectedFile); return fd; })()
                      }
                    : { 
                        method: 'POST', 
                        headers: { 'Content-Type': 'application/json', 'X-API-Key': API_KEY }, 
                        body: JSON.stringify({ message: text, history: chatHistory }) 
                      };

                const r = await fetch(`${API_URL}${endpoint}`, fetchOptions);
                const d = await r.json();
                
                selectedFile = null;

                if (!r.ok) {
                    bubble.innerHTML = `Error: ${JSON.stringify(d.detail) || 'Check connection'}`;
                    return;
                }

                if (d.status === 'ANSWERED') {
                    let html = `<strong>${d.value || '—'}</strong>`;
                    html += `<div class="meta">source: ${d.source || '—'} · verified: ${d.verified}</div>`;
                    if (d.tool_calls && d.tool_calls.length) {
                        html += `<div class="meta">tools: ${d.tool_calls.map(t => t.tool || t.name).join(', ')}</div>`;
                    }
                    if (d.eat_decision) {
                        html += `<div class="meta">eat: ${d.eat_decision.action}</div>`;
                    }
                    bubble.innerHTML = html;
                    
                    chatHistory.push({ role: "user", content: text });
                    chatHistory.push({ role: "assistant", content: d.value });
                    if (chatHistory.length > 10) chatHistory = chatHistory.slice(-10);
                    
                } else {
                    bubble.innerHTML = d.value || "Abstained. No matching residual fact or search result.";
                }
            } catch (e) {
                bubble.innerHTML = 'Network error.';
            } finally {
                sendBtn.disabled = false;
                input.focus();
            }
        }
    </script>
</body>
</html>

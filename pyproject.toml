[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resileos"
version = "1.0.0"
description = "Hybrid Classical Residual Core + HDRIFT Generative Substrate"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "jackyreaps" }]

dependencies = [
  "numpy>=1.24",
  "torch>=2.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "jsonschema>=4",
  "httpx>=0.27",
]
ui = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "streamlit>=1.30",
  "pandas>=2.0",
  "requests>=2.31",
]
all = [
  "resileos[dev,ui]",
]

[project.scripts]
titanos = "titanos:main"

# Loose top-level modules (root copies of scripts/*.py + the FastAPI app)
[tool.setuptools]
py-modules = ["app", "titanos", "run_hybrid"]

# Package discovery for src/resileos
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = [
  "E501",
  "N803",
  "N806",
  "N812",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resileos"
version = "1.0.0"
description = "Hybrid Classical Residual Core + HDRIFT Generative Substrate"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "jackyreaps" }]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7", "jsonschema>=4"]
ui = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "streamlit>=1.30",
  "pandas>=2.0",
  "requests>=2.31",
]
all = ["resileos[dev,ui]"]

[project.scripts]
titanos = "titanos:main"

[tool.setuptools.packages.find]
where = ["src", "scripts"]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]

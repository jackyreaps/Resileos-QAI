[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resileos"
version = "1.0.0"
description = "Hybrid Classical Residual Core + HDRIFT Generative Substrate"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "jackyreaps" }]
dependencies = [
    "numpy>=1.24",
    "torch @ https://download.pytorch.org/whl/cpu/torch-2.2.1%2Bcpu-cp311-cp311-linux_x86_64.whl",
    "requests>=2.31",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "jsonschema>=4",
    "httpx>=0.27",
    "requests>=2.31",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "scikit-learn>=1.3",
    "pillow>=10",
]
ui = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "streamlit>=1.30",
    "pandas>=2.0",
]
all = ["resileos[dev,ui]"]

[project.scripts]
titanos = "titanos:main"

[tool.setuptools]
py-modules = ["app", "titanos", "run_hybrid"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"resileos.kin.demigods" = ["guides/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501", "N803", "N806", "N812"]
